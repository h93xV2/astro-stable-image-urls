name: Tests

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        name: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup tools
              uses: jdx/mise-action@v5

            - name: Install dependencies
              run: bun ci

            - name: Check code
              run: bun run check

            - name: Run tests
              run: bun run test
